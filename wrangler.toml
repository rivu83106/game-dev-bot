name = "game-dev-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = ["0 0 * * *"]

# ===================================================
# バインディングは Cloudflare Dashboard で設定済み:
#   DB  → D1 database  : game-dev-bot-db
#   KV  → KV namespace : game-dev-bot-kv
#
# シークレットも Dashboard / wrangler secret put で設定:
#   DISCORD_PUBLIC_KEY
#   DISCORD_TOKEN
#
# ローカル開発 (wrangler dev) で使う場合は
# 下記のコメントを外して実際のIDを記入してください:
# ===================================================

# [[d1_databases]]
# binding      = "DB"
# database_name = "game-dev-bot-db"
# database_id  = "YOUR_D1_DATABASE_ID"

# [[kv_namespaces]]
# binding = "KV"
# id      = "YOUR_KV_NAMESPACE_ID"
